name: OZ Auto Upstream

on:
  # GitHub không gửi event cho fork khi repo upstream có commit/tag mới.
  # Vì vậy polling theo lịch (giờ UTC, lịch chạy có thể bị GitHub trì hoãn).
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'theirs = ưu tiên patch cá nhân, fail = dừng khi conflict'
        type: choice
        options: [theirs, fail, ours]
        default: theirs
  push:
    branches:
      - dev

# GITHUB_TOKEN chỉ cần quyền đọc. Push dùng OZ_SYNC_PAT có quyền workflow.
permissions:
  contents: read

concurrency:
  group: kernelsu-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Không dùng GITHUB_TOKEN để push: các tag cũ chứa file workflow.
      # Nếu không có PAT thì báo lỗi sớm, tránh chạy cherry-pick vô ích.
      - name: Kiểm tra secret OZ_SYNC_PAT
        shell: bash
        env:
          SYNC_PAT: ${{ secrets.OZ_SYNC_PAT }}
        run: |
          if [[ -z "$SYNC_PAT" ]]; then
            echo '::error::Thiếu Actions Secret OZ_SYNC_PAT. Hãy tạo PAT có quyền ghi Contents và Workflows cho repository này.'
            exit 1
          fi

      - name: Checkout đầy đủ lịch sử
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Credential này được giữ để git push dùng PAT có quyền workflow.
          token: ${{ secrets.OZ_SYNC_PAT }}
          persist-credentials: true

      # Cache này hỗ trợ học lại conflict từng được giải thủ công trên runner.
      # --strategy theirs vẫn chỉ là quyết định ở mức text hunk, không kiểm tra semantic.
      - name: Cache git rerere
        uses: actions/cache@v4
        with:
          path: .git/rr-cache
          key: kernelsu-rerere-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kernelsu-rerere-

      - name: Thiết lập danh tính Git ozsx (giữ author của commit cá nhân)
        env:
          TAGGER_EMAIL: ${{ vars.SYNC_TAGGER_EMAIL || 'ozsxe@icloud.com' }}
        shell: bash
        run: |
          if [[ -z "$TAGGER_EMAIL" ]]; then
            echo '::error::SYNC_TAGGER_EMAIL rỗng; kiểm tra cấu hình email của ozsx.'
            exit 1
          fi
          git config user.name 'ozsx'
          git config user.email "$TAGGER_EMAIL"
          git config rerere.enabled true
          git config rerere.autoupdate true

      - name: Tự rebuild, check, push main + staging + tag theo transaction
        env:
          POLICY: ${{ inputs.strategy || 'theirs' }}
          # Fork này dùng master và hậu tố -ozsx theo log. Có thể đổi trong
          # Settings > Secrets and variables > Actions > Variables.
          TARGET_BRANCH: ${{ vars.SYNC_TARGET_BRANCH || 'master' }}
          TAG_SUFFIX: ${{ vars.SYNC_TAG_SUFFIX || '-ozsx' }}
          # Mặc định dùng ozsxe@icloud.com; có thể ghi đè bằng Actions Variable.
          # Email cần được xác minh trên GitHub để liên kết danh tính ozsx.
          TAGGER_EMAIL: ${{ vars.SYNC_TAGGER_EMAIL || 'ozsxe@icloud.com' }}
          # Tuỳ chọn: cấu hình repository variable SYNC_CHECK_CMD.
          # Ví dụ: cargo check --locked --workspace
          CHECK_CMD: ${{ vars.SYNC_CHECK_CMD }}
        shell: bash
        run: |
          # Dùng dạng --option=value để argparse không nhầm hậu tố bắt đầu bằng dấu - là option mới.
          args=(--push --strategy "$POLICY" --target "$TARGET_BRANCH" "--tag-suffix=$TAG_SUFFIX")
          # Luôn truyền danh tính ozsx cho committer và annotated tagger.
          # Thiếu email thì dừng, không bao giờ fallback về bot.
          if [[ -z "$TAGGER_EMAIL" ]]; then
            echo '::error::Thiếu SYNC_TAGGER_EMAIL.'
            exit 1
          fi
          args+=(--tagger-name ozsx --tagger-email "$TAGGER_EMAIL")
          if [[ -n "$CHECK_CMD" ]]; then
            args+=(--check-cmd "$CHECK_CMD")
          else
            echo '::warning::Chưa thiết lập SYNC_CHECK_CMD. Chỉ có kiểm tra Git diff --check, không có build/test.'
          fi
          python3 scripts/auto_sync.py "${args[@]}"

      - name: Tóm tắt báo cáo
        if: always()
        shell: bash
        run: |
          if [[ -f sync-reports/report.md ]]; then
            cat sync-reports/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Chưa có báo cáo. Hãy xem log của job.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tải báo cáo JSON và Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-auto-sync-report
          path: sync-reports/
          if-no-files-found: ignore
